name: Build Complete iOS IPA & App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Executable App
        run: |
          xcodebuild build \
            -project TVP3ND.xcodeproj \
            -scheme TVP3ND \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Full IPA Container
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r TVP3ND_Complete.ipa Payload
          cd ..

      - name: Upload Complete IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVP3ND-Full-IPA
          path: build/TVP3ND_Complete.ipa
