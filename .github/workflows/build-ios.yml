name: Build Complete iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TVP3ND.xcodeproj \
            -scheme TVP3ND \
            -sdk iphoneos \
            -archivePath build/TVP3ND.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Payload and Pack IPA
        run: |
          mkdir -p build/Payload
          cp -R build/TVP3ND.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r TVP3ND_Complete.ipa Payload
          cd ..

      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TVP3ND-Full-IPA
          path: build/TVP3ND_Complete.ipa
